name: tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify every README example runs
        run: |
          set -euo pipefail
          printf 'id;name\n1;Ana\n2;Bob\n' | python3 -m datakit csv jsonl --delimiter ';'
          echo '[{"id":1,"name":"Ana","tags":["a","b"]}]' | python3 -m datakit json csv
          echo '[{"id":1,"user":{"name":"Ana"}}]' | python3 -m datakit json csv --columns id,user.name
          echo '[{"id":1,"items":["a","b"]}]' | python3 -m datakit json xml --root rows --record row
          echo '<items><item><id>1</id></item><item><id>2</id></item></items>' | python3 -m datakit xml json
          echo '<items><item><id>1</id></item><item><id>2</id></item></items>' | python3 -m datakit xml csv
          printf 'id,name\n1,Ana\n' | python3 -m datakit csv jsonl | python3 -m datakit jsonl csv
