[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datakit"
version = "1.0.0"
description = "Zero-dependency converters between CSV, JSON, JSONL and XML"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["csv", "json", "jsonl", "xml", "etl", "converter", "data"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
datakit = "datakit.cli:main"

[project.urls]
Homepage = "https://github.com/ardani13ln-byte/pipeline-toolkit"
Issues = "https://github.com/ardani13ln-byte/pipeline-toolkit/issues"

[tool.setuptools]
packages = ["datakit"]